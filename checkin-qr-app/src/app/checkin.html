<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm danh - Quét mã QR</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thư viện quét QR (html5-qrcode) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-6 border border-slate-100">
        <!-- Tiêu đề -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Điểm Danh Nhanh</h1>
            <p class="text-sm text-slate-500 mt-1">Nhập thông tin và quét mã QR xác thực ca trực/lớp học</p>
        </div>

        <!-- Form nhập thông tin -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Mã Sinh Viên / Nhân Sự</label>
                <input type="text" id="userId" placeholder="Ví dụ: B21DCCN123" 
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-slate-800">
            </div>

            <!-- Nút mở camera quét QR -->
            <div>
                <button onclick="openScanner()" type="button" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    Mở Camera Quét Mã QR
                </button>
            </div>
        </div>

        <!-- Khu vực hiển thị Camera quét -->
        <div id="reader-container" class="mt-6 hidden">
            <div id="reader" class="rounded-xl overflow-hidden border border-slate-200"></div>
            <button onclick="closeScanner()" type="button" 
                class="w-full mt-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 px-4 rounded-xl transition">
                Đóng Camera
            </button>
        </div>

        <!-- Kết quả điểm danh -->
        <div id="result-box" class="mt-6 hidden p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm">
            <p class="font-semibold">Điểm danh thành công! 🎉</p>
            <p id="result-text" class="mt-1"></p>
        </div>
    </div>

    <!-- Script xử lý logic quét QR -->
    <script>
        let html5QrCode;

        function openScanner() {
            const userId = document.getElementById('userId').value.trim();
            if (!userId) {
                alert("Vui lòng nhập Mã Sinh Viên/Nhân sự trước khi quét QR!");
                document.getElementById('userId').focus();
                return;
            }

            // Hiển thị khung chứa camera
            document.getElementById('reader-container').classList.remove('hidden');

            // Khởi tạo thư viện quét QR
            html5QrCode = new Html5Qrcode("reader");
            
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            
            html5QrCode.start(
                { facingMode: "environment" }, // Dùng camera sau trên điện thoại
                config,
                (decodedText, decodedResult) => {
                    // Khi quét thành công mã QR
                    onScanSuccess(decodedText, userId);
                },
                (errorMessage) => {
                    // Lỗi quét liên tục từng khung hình (bỏ qua không cần xử lý)
                }
            ).catch((err) => {
                alert("Không thể mở được camera. Vui lòng cấp quyền sử dụng camera cho trình duyệt!");
                console.error(err);
            });
        }

        function onScanSuccess(qrCodeData, userId) {
            // Dừng camera sau khi quét thành công
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader-container').classList.add('hidden');
                }).catch(err => console.error(err));
            }

            // Hiển thị kết quả
            const resultBox = document.getElementById('result-box');
            const resultText = document.getElementById('result-text');
            resultBox.classList.remove('hidden');
            resultText.innerHTML = `Mã NV/SV: <b>${userId}</b><br>Nội dung QR: <b>${qrCodeData}</b>`;

            // *Ghi chú:* Ở đây bạn có thể dùng fetch() để gửi dữ liệu userId và qrCodeData về Backend (C#, Java) lưu vào Database.
        }

        function closeScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader-container').classList.add('hidden');
                }).catch(err => console.error(err));
            }
        }
    </script>
</body>
</html>
